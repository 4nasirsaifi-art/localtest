name: Scheduled Docker Build

on:
  schedule:
    - cron: '30 21 * * *'   # roz raat 3:00 AM UTC pe chalega
  workflow_dispatch:        # manually bhi trigger kar sakte ho "Run workflow" button se

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Image
        run: |
          docker build -t 4nasir/nginx-app:latest .
          docker push 4nasir/nginx-app:latest